<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blog{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">Blog</a>
    <div class="ms-auto d-flex align-items-center gap-2">
      {% if current_user.is_authenticated %}
        <span class="text-light">{{ current_user.username }}</span>
        <form method="post" action="#" class="m-0">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{{ url_for("auth.login") }}">Login</a>
        <a class="btn btn-light btn-sm" href="{{ url_for("auth.register") }}">Register</a>
      {% endif %}
    </div>
  </nav>

  <main class="container my-4" style="max-width: 600px;">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
  
</body>
</html>

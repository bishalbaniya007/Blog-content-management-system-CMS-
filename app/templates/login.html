{% extends "base.html" %}

{% from "_macros.html" import render_field %}

{% block title%} Login {% endblock %}

{% block content %}
  <form method="POST">
    {{ form.hidden_tag() }}
    {{ render_field(form.email) }}
    {{ render_field(form.password) }}
    {{ form.submit(class="btn btn-primary") }}
  </form>

  <p class="mt-3">
    No account? <a href="{{ url_for('auth.register') }}">Register</a>
  </p>

{% endblock %}
